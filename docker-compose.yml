version: "3.8"

services:
  backend:
    image: salman/school-ops-backend:latest_0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_ops_backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret}
      DEBUG: ${DEBUG:-false}
      PORT: 8080
      WORKERS: ${WORKERS:-2}

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
